{% extends 'base.html' %}

{% block content %}
<h1 class="mb-6 text-3xl">Удаление статуса</h1>
<p class="mb-4">Вы уверены, что хотите удалить {{ object.name }}?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="rounded bg-red-600 px-5 py-2 text-white hover:bg-red-700">Да, удалить</button>
</form>
{% endblock %}
